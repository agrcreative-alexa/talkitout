<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talk It Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,500;0,700;0,800;1,600&display=swap">
<style>
/* SHARED — design tokens and page frame. Pieces may ADD tokens here, never rename or remove.
   Layout: one column, three stacked regions (top bar / scrolling stage / docked footer) filling the viewport. */
:root {
  --ink: #23304f;         /* text */
  --ink-soft: #6a7592;    /* secondary text */
  --paper: #ffffff;
  --mist: #eef3fb;        /* quiet fills, tracks */
  --line: #dfe6f2;        /* borders */
  --line-deep: #c9d3e6;   /* chunky bottom edge of buttons/cards */
  --banana: #ffc933;      /* brand accent */
  --banana-deep: #e0a800;
  --pick: #3b82f6;        /* selected */
  --pick-wash: #e3efff;
  --great: #1fa97a;  --great-wash: #dcf7ec;  --great-deep: #14815c;
  --ok: #e08a00;     --ok-wash: #fff1d1;     --ok-deep: #b06c00;
  --oops: #e5484d;   --oops-wash: #ffe3e2;   --oops-deep: #b93338;
  --display: 'Baloo 2', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --r: 16px;
  --col: 640px;           /* content column */
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 500 18px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--pick); outline-offset: 3px; }
#tio { height: 100%; display: flex; flex-direction: column; }
#tio-top, #tio-dock { flex: none; }
#tio-stage { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable both-edges; padding: 8px 20px 24px; }
#tio-stage > * { max-width: var(--col); margin-inline: auto; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* PIECE C — lesson chrome and flow */

/* ---------- frame: the three regions fill the viewport, the page body never scrolls ---------- */
html, body { overflow: hidden; overscroll-behavior: none; }
#tio { height: 100vh; height: 100dvh; }
#tio-stage { overflow-x: hidden; }
#tio-dock { max-height: 72vh; max-height: 72dvh; overflow-y: auto; }   /* safety net: a tall dock scrolls itself, not the page */

/* ---------- shared chunky button (other pieces recolour background + box-shadow) ---------- */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 0 28px;
  border: 0; border-radius: var(--r); font: 800 17px/1 var(--body); letter-spacing: .07em; text-transform: uppercase; white-space: nowrap;
  background: var(--banana); color: var(--ink); box-shadow: 0 5px 0 var(--banana-deep);
  -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
  transition: transform .07s ease-out, box-shadow .07s ease-out, filter .12s; }
.btn:hover:not(:disabled) { filter: brightness(1.05); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: none; filter: none; }
.btn:disabled { background: var(--mist); color: #a9b3c9; box-shadow: 0 5px 0 var(--line); cursor: default; }
.btn:focus-visible { outline: 3px solid var(--pick); outline-offset: 4px; }

/* ---------- mascot ---------- */
.mk { display: block; overflow: visible; }
.mk-hero { width: 100%; height: 100%; }
.mk-hero .mk-wave { transform-origin: 74px 150px; animation: mk-wave 2.6s ease-in-out infinite; }
.mk-hero .mk-bob { animation: mk-bob 3.2s ease-in-out infinite; }
.mk-hero .mk-tail { transform-origin: 72px 180px; animation: mk-tail 3.2s ease-in-out infinite; }
.mk-hero .mk-eyes { transform-box: fill-box; transform-origin: center; animation: mk-blink 4.2s infinite; }
@keyframes mk-wave { 0%, 55%, 100% { transform: rotate(0); } 62%, 78% { transform: rotate(-16deg); } 70%, 86% { transform: rotate(8deg); } }
@keyframes mk-bob { 0%, 100% { transform: translate(40px, 20px); } 50% { transform: translate(40px, 23px); } }
@keyframes mk-tail { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(5deg); } }
@keyframes mk-blink { 0%, 46%, 50%, 100% { transform: scaleY(1); } 48% { transform: scaleY(.1); } }

/* ---------- start screen ---------- */
.start { position: relative; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-block: 12px 20px; }
.start-hero { position: relative; width: 300px; height: 270px; margin-bottom: 2px; }
.start-hero::before { content: ''; position: absolute; left: 50%; bottom: 6px; width: 264px; height: 264px; margin-left: -132px; border-radius: 50%;
  background: radial-gradient(circle at 50% 40%, #fff3c4 0, #ffe9a0 60%, #ffe08a 100%); }
.start-monkey { position: absolute; inset: 0; animation: start-pop .55s cubic-bezier(.2, 1.4, .4, 1) backwards; }
.start-bubble { position: absolute; z-index: 1; left: 64%; top: -14px; width: 178px; margin: 0; padding: 10px 14px; border-radius: 18px; background: var(--paper);
  border: 2.5px solid var(--ink); box-shadow: 0 4px 0 var(--ink); font: 800 16px/1.2 var(--body); text-align: left;
  transform-origin: 0 100%; animation: start-say .4s .45s cubic-bezier(.2, 1.5, .4, 1) backwards; }
.start-bubble b { color: var(--ok-deep); }
.start-bubble::after { content: ''; position: absolute; left: 16px; bottom: -11px; width: 16px; height: 16px; background: var(--paper);
  border-right: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); transform: skewX(28deg) rotate(45deg); }
.start-title { margin: 6px 0 0; font: 800 68px/.95 var(--display); letter-spacing: -.01em; color: var(--ink); animation: start-rise .45s .1s ease-out backwards; }
.start-title span { display: inline-block; padding: 0 .12em; border-radius: 14px; background: var(--banana); transform: rotate(-3deg); }
.start-sub { margin: 12px 0 22px; font-size: 20px; font-weight: 700; color: var(--ink-soft); animation: start-rise .45s .18s ease-out backwards; }
.start-sub em { font-style: normal; color: var(--ink); }
.start .btn-go { width: min(340px, 100%); min-height: 66px; border-radius: 20px; font-size: 22px; letter-spacing: .1em; box-shadow: 0 6px 0 var(--banana-deep); margin-bottom: 6px;
  animation: start-rise .45s .26s ease-out backwards, start-nudge 2.4s 1.6s ease-in-out infinite; }
.start .btn-go:active:not(:disabled) { transform: translateY(6px); animation: none; }
.start-skills { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 8px; max-width: 540px; margin: 22px 0 0; padding: 0; }
.sticker { padding: 6px 13px; border-radius: 12px; border: 2px solid rgba(35, 48, 79, .1); font: 800 14px/1.2 var(--body); transform: rotate(var(--tilt, 0deg));
  animation: start-stick .35s calc(.5s + var(--n, 0) * .07s) cubic-bezier(.2, 1.6, .4, 1) backwards; }
.sticker-0 { background: var(--pick-wash); } .sticker-1 { background: var(--great-wash); } .sticker-2 { background: var(--ok-wash); }
.sticker-3 { background: var(--oops-wash); } .sticker-4 { background: #efe6ff; }
@keyframes start-pop { from { transform: translateY(30px) scale(.7); opacity: 0; } }
@keyframes start-say { from { transform: scale(0) rotate(-12deg); opacity: 0; } }
@keyframes start-rise { from { transform: translateY(14px); opacity: 0; } }
@keyframes start-stick { from { transform: scale(0) rotate(0); opacity: 0; } }
@keyframes start-nudge { 0%, 78%, 100% { transform: none; } 84% { transform: translateY(-5px) rotate(-1.5deg); } 90% { transform: translateY(0) rotate(1deg); } 95% { transform: translateY(-2px); } }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 14px; max-width: 860px; margin: 0 auto; padding: 22px 20px 12px; animation: top-drop .35s ease-out backwards; }
.topbar-quit { flex: none; display: grid; place-items: center; width: 44px; height: 44px; margin: 0 -8px 0 -12px; padding: 0; border: 0; border-radius: 14px; background: none; color: #a9b3c9;
  transition: color .12s, background .12s, transform .08s; }
.topbar-quit:hover { color: var(--ink-soft); background: var(--mist); }
.topbar-quit:active { transform: scale(.9); }
.progress { position: relative; flex: 1; min-width: 0; height: 18px; }
.progress-track { height: 100%; border-radius: 99px; background: var(--mist); box-shadow: inset 0 2px 0 rgba(35, 48, 79, .06); overflow: hidden; }
.progress-fill { position: relative; width: 0; height: 100%; border-radius: 99px; background: var(--banana); box-shadow: inset 0 -4px 0 rgba(224, 168, 0, .55);
  transition: width .7s cubic-bezier(.3, 1.35, .45, 1); }
.progress-fill::after { content: ''; position: absolute; left: 9px; right: 22px; top: 4px; height: 4px; border-radius: 9px; background: rgba(255, 255, 255, .6); }
.progress-lane { position: absolute; inset: 0 14px; pointer-events: none; }
.progress-rider { position: absolute; left: 0; top: 50%; width: 40px; height: 40px; margin: -21px 0 0 -20px; transition: left .7s cubic-bezier(.3, 1.35, .45, 1);
  filter: drop-shadow(0 2px 0 rgba(35, 48, 79, .18)); }
.is-snap .progress-fill, .is-snap .progress-rider { transition: none; }
.progress.is-bump .progress-track { animation: bar-glow .7s ease-out; }
.progress-rider.is-hop .mk { animation: rider-hop .7s cubic-bezier(.3, .7, .4, 1); }
.progress-rider.is-shake .mk { animation: rider-shake .5s ease-in-out; }
.topbar-count, .topbar-streak { position: relative; flex: none; display: flex; align-items: center; gap: 4px; white-space: nowrap; font: 800 24px/1 var(--display); color: var(--ink); }
.topbar-count b, .topbar-streak b { display: inline-block; min-width: .62em; padding-top: .12em; font-weight: 800; font-variant-numeric: tabular-nums; text-align: left; }
.topbar-streak { gap: 1px; color: #e85d04; margin-right: -2px; }
.topbar-streak[hidden], .quit[hidden] { display: none; }
.topbar-count.is-bump .ico-banana { animation: count-pop .55s cubic-bezier(.3, 1.6, .4, 1); }
.topbar-count.is-bump b { animation: count-tick .45s cubic-bezier(.3, 1.6, .4, 1); }
.topbar-streak.is-bump { animation: streak-pop .5s cubic-bezier(.3, 1.7, .4, 1); }
.topbar-plus { position: absolute; right: 0; top: 100%; padding: 3px 8px; border-radius: 99px; background: var(--banana); color: var(--ink); font: 800 15px/1 var(--body);
  pointer-events: none; animation: plus-float 1s ease-out forwards; }
@keyframes top-drop { from { transform: translateY(-16px); opacity: 0; } }
@keyframes bar-glow { 30% { box-shadow: 0 0 0 5px rgba(255, 201, 51, .35); } }
@keyframes rider-hop { 0% { transform: none; } 30% { transform: translateY(-13px) rotate(-12deg) scale(1.12); } 55% { transform: translateY(0) rotate(6deg); } 75% { transform: translateY(-5px); } 100% { transform: none; } }
@keyframes rider-shake { 0%, 100% { transform: none; } 20%, 60% { transform: translateX(-4px) rotate(-8deg); } 40%, 80% { transform: translateX(4px) rotate(8deg); } }
@keyframes count-pop { 0% { transform: none; } 40% { transform: scale(1.45) rotate(-18deg); } 100% { transform: none; } }
@keyframes count-tick { 0% { transform: translateY(8px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes streak-pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes plus-float { 0% { transform: translateY(-6px) scale(.5); opacity: 0; } 20% { transform: translateY(4px) scale(1.1); opacity: 1; } 70% { transform: translateY(6px); opacity: 1; } 100% { transform: translateY(16px); opacity: 0; } }

/* ---------- round-to-round: the new scene slides in, feedback dock rises ---------- */
#tio-stage.is-arriving > * { animation: stage-arrive .26s cubic-bezier(.2, .9, .3, 1.08) backwards; }
@keyframes stage-arrive { from { transform: translateX(36px); } }   /* slide only: the new round is readable from frame 0 */

/* ---------- quit confirm ---------- */
.quit { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(35, 48, 79, .6); animation: quit-fade .18s ease-out; }
.quit-card { width: min(360px, 100%); display: flex; flex-direction: column; align-items: center; padding: 22px 22px 18px; border-radius: 26px; background: var(--paper); text-align: center;
  box-shadow: 0 8px 0 rgba(35, 48, 79, .35); animation: quit-pop .3s cubic-bezier(.2, 1.4, .4, 1); }
.quit-art { margin-top: -4px; }
.quit-head { margin: 6px 0 0; font: 800 30px/1.1 var(--display); }
.quit-text { margin: 4px 0 18px; font-size: 18px; font-weight: 700; color: var(--ink-soft); }
.quit-card .btn { width: 100%; }
.quit-leave { margin-top: 8px; background: var(--paper); color: var(--oops); box-shadow: inset 0 0 0 2px var(--line), 0 5px 0 var(--line); }
.quit-leave:hover:not(:disabled) { filter: none; background: var(--oops-wash); }
.quit-leave:active:not(:disabled) { box-shadow: inset 0 0 0 2px var(--line); }
@keyframes quit-fade { from { opacity: 0; } }
@keyframes quit-pop { from { transform: translateY(24px) scale(.9); opacity: 0; } }

/* ---------- small screens ---------- */
@media (max-width: 480px) {
  .topbar { gap: 10px; padding: 14px 16px 8px; }
  .topbar-quit { margin: 0 -8px 0 -12px; }
  .topbar-count, .topbar-streak { font-size: 21px; }
  .topbar-count .ico-banana { width: 24px; height: 24px; }
  .start-hero { width: 236px; height: 212px; }
  .start-hero::before { width: 208px; height: 208px; margin-left: -104px; }
  .start-bubble { left: 50%; top: -30px; width: 150px; padding: 8px 12px; font-size: 14.5px; }
  .start-title { font-size: 54px; }
  .start-sub { font-size: 16px; margin: 10px 0 18px; }
  .start-skills { margin-top: 18px; }
}
@media (max-height: 640px) {
  .start-hero { width: 178px; height: 160px; }
  .start-hero::before { width: 158px; height: 158px; margin-left: -79px; }
  .start-bubble { left: 54%; top: -26px; width: 150px; font-size: 14px; }
  .start-title { font-size: 46px; }
  .start-sub { margin: 8px 0 14px; }
  .start-skills { margin-top: 14px; }
}

/* PIECE A — scene screen
   Reading order: 1 the speech bubble (hero) · 2 "What do you say?" · 3 the three reply cards. Everything else stays quiet.
   The scene fills the stage: the three cards share out whatever height is left, so the screen is never top-heavy.
   After Check (.scene.is-checked) the top compacts so all three cards sit between the top bar and the feedback sheet. */
.scene { --tag: var(--banana-deep); display: flex; flex-direction: column; gap: 18px; padding-top: 10px; min-height: 100%; }
.scene[data-skill="real"] { --tag: #e0568a; }
.scene[data-skill="present"] { --tag: #3b82f6; }
.scene[data-skill="well"] { --tag: #14a3b8; }
.scene[data-skill="comfort"] { --tag: #8b5cf6; }
.scene[data-skill="cool"] { --tag: #1fa97a; }
.scene-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* skill tag + one-line setting */
.scene-head { flex: none; display: flex; flex-direction: column; gap: 6px; }
.scene-skill { margin: 0; display: flex; align-items: center; gap: 8px; font: 800 15px/1 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--tag); }
.scene-skill-ic { flex: none; width: 26px; height: 26px; padding: 5px; border-radius: 50%; background: var(--tag); color: #fff; }
/* the setting is the one line that must not be skipped: body size, full ink (lighter in weight than the bubble) */
.scene-setting { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.3; color: var(--ink); text-wrap: pretty; }

/* speaker: drawn character + speech bubble */
.speaker { flex: none; display: flex; align-items: center; gap: 22px; }
.char { flex: none; width: 172px; }
.char-svg { display: block; width: 100%; height: auto; overflow: visible; }
.char-eyes { transform-box: fill-box; transform-origin: 50% 60%; animation: char-blink 4.6s 1.4s infinite; }
.bubble { position: relative; flex: 0 1 auto; min-width: 0; padding: 22px 24px 20px; border: 3px solid var(--ink); border-radius: 26px; background: var(--paper);
  box-shadow: 0 6px 0 rgba(35, 48, 79, .16); }
.bubble::before { content: ''; position: absolute; left: -12px; top: 50%; width: 19px; height: 19px; margin-top: -4px; background: var(--paper);
  border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink); border-bottom-left-radius: 5px; transform: rotate(45deg) skew(8deg, 8deg); }
.bubble-who { position: absolute; left: 18px; top: -13px; padding: 5px 12px 4px; border-radius: 99px; background: var(--ink); color: #fff;
  font: 800 13px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.bubble-says { margin: 0; font: 800 28px/1.18 var(--display); color: var(--ink); text-wrap: balance; }
.bubble-short .bubble-says { font-size: 32px; }
.bubble-long .bubble-says { font-size: 25px; }

.scene-ask { flex: none; margin: 2px 0 -6px; font: 800 24px/1.1 var(--display); color: var(--ink); }

/* reply cards — three different-coloured blocks, each led by a face showing how it's said */
.replies { flex: 1 1 auto; display: flex; flex-direction: column; gap: 14px; padding-bottom: 6px; }
.reply { --tint: #fff5d2; --edge: #f2cf63; --deep: #dcae2c; --face: #ffc933; --face-deep: #e0a800;
  position: relative; flex: 1 1 auto; display: flex; align-items: center; gap: 16px; width: 100%; min-height: 88px; max-height: 170px; text-align: left; padding: 12px 20px 12px 14px;
  border: 3px solid var(--edge); border-radius: 22px; background: var(--tint); color: var(--ink);
  box-shadow: 0 6px 0 var(--deep); -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: transform .09s, box-shadow .09s, background-color .12s, border-color .12s; }
.reply-p1 { --tint: #ffe8f1; --edge: #f8b3cf; --deep: #e386ad; --face: #ff8fb8; --face-deep: #df6397; }
.reply-p2 { --tint: #ebe6ff; --edge: #c5b6fb; --deep: #9d87ea; --face: #a98dfb; --face-deep: #8364e2; }

.reply-face { flex: none; width: 96px; transition: transform .16s cubic-bezier(.3, 1.6, .5, 1); }
.vf { display: block; width: 100%; height: auto; overflow: visible; }
.vf-head, .vf-hand { fill: var(--face); }
.vf-edge { fill: var(--face-deep); }
.vf-hand { stroke: var(--face-deep); stroke-width: 2; }

.reply-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.reply-text { font: 800 21px/1.25 var(--body); text-wrap: pretty; }
/* the "do" half of a reply: a quiet stage direction, the same on every card, so it never hints at the answer */
.reply-act { display: flex; align-items: flex-start; gap: 5px; font: italic 600 15.500px/1.25 var(--body); color: #55607d; text-wrap: pretty; }
.reply-act-ic { flex: none; width: 15px; height: 15px; margin-top: 2px; opacity: .7; }

/* 1/2/3 keyboard hint: small, in the corner, desktop only */
.reply-key { position: absolute; top: 8px; right: 10px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 7px; display: grid; place-items: center;
  font: 800 12px/1 var(--body); color: #55607d; background: rgba(255, 255, 255, .75); box-shadow: inset 0 0 0 1.500px rgba(35, 48, 79, .16), 0 2px 0 rgba(35, 48, 79, .12); }

/* hover: the whole card lifts, deepens in colour and gets a darker edge */
@media (hover: hover) {
  .reply:hover { transform: translateY(-4px); border-color: var(--deep); background-color: color-mix(in srgb, var(--tint) 72%, var(--edge));
    box-shadow: 0 10px 0 var(--deep), 0 18px 22px -8px rgba(35, 48, 79, .32); }
  .reply:hover .reply-face { transform: scale(1.1) rotate(-5deg); }
}
.reply:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--deep); }
.reply:focus-visible { outline: 3px solid var(--pick); outline-offset: 3px; }

/* picked: the loudest thing on the screen — solid blue, a touch bigger, its face turned blue to match */
.reply.is-picked .reply-face { transform: scale(1.12) rotate(-6deg); }
.scene:not(.is-checked) .reply.is-picked { --edge: #1d4fc4; --deep: #173f9c; --tint: #2563eb; --face: #d6e6ff; --face-deep: #8fb4f5;
  color: #fff; background-color: var(--tint); border-color: var(--edge); transform: scale(1.025); z-index: 1;
  box-shadow: 0 7px 0 var(--deep), 0 0 0 5px rgba(37, 99, 235, .26); }
.scene:not(.is-checked) .reply.is-picked:active { transform: scale(1.005) translateY(4px); box-shadow: 0 2px 0 var(--deep), 0 0 0 5px rgba(37, 99, 235, .26); }
.scene:not(.is-checked) .reply.is-picked:focus-visible { outline-color: var(--ink); outline-offset: 7px; }
.scene:not(.is-checked) .reply.is-picked .reply-act { color: #dbe8ff; }
.scene:not(.is-checked) .reply.is-picked .reply-key { background: #fff; color: #1d4fc4; box-shadow: 0 2px 0 #173f9c; }
/* ...and while one is picked the other two step back: pale card, greyed face, softer text (still plainly tappable) */
.scene.has-pick .reply:not(.is-picked) { --tint: #f7f9fc; --edge: var(--line); --deep: var(--line-deep); color: #5d6883; box-shadow: 0 4px 0 var(--deep); }
.scene.has-pick .reply:not(.is-picked) .reply-face { filter: saturate(.3); opacity: .7; }
.scene.has-pick .reply:not(.is-picked) .reply-act { color: #7b859d; }
.scene.has-pick .reply:not(.is-picked) .reply-key { opacity: .7; }
@media (hover: hover) {
  .scene.has-pick .reply:not(.is-picked):hover { border-color: var(--ink-soft); background-color: #fff; color: var(--ink);
    box-shadow: 0 8px 0 var(--line-deep), 0 16px 20px -8px rgba(35, 48, 79, .3); }
  .scene.has-pick .reply:not(.is-picked):hover .reply-face { filter: none; opacity: 1; }
}
/* gentle (loss) rounds: the three reply faces are quiet and muted */
.scene[data-tone="gentle"] .reply { --face: #f0d488; --face-deep: #cdb065; }
.scene[data-tone="gentle"] .reply-p1 { --face: #eeb4c8; --face-deep: #cf8fa7; }
.scene[data-tone="gentle"] .reply-p2 { --face: #c3b6ee; --face-deep: #a092d4; }

/* after Check: every card is still a button (tap = see its reason) */
.reply-mark { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--edge); }
.reply-mark-ic { width: 23px; height: 23px; }
.reply-why { background: var(--paper); color: var(--ink-soft); font: 800 20px/1 var(--display); box-shadow: inset 0 0 0 2px var(--line-deep), 0 3px 0 var(--line-deep); }
.reply-flag { position: absolute; top: -13px; left: 16px; display: flex; align-items: center; gap: 4px; padding: 5px 11px 4px; border-radius: 99px; background: var(--edge); color: #fff;
  font: 800 12.500px/1 var(--body); letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 2px 0 var(--deep); }
.reply-flag-ic { width: 13px; height: 13px; margin-top: -1px; }
.scene.is-checked .reply-key { display: none; }

.reply.is-dim { --tint: var(--paper); --edge: var(--line); --deep: var(--line-deep); box-shadow: 0 4px 0 var(--deep); }
.reply.is-dim .reply-text { color: #48546f; }
.reply.is-great, .reply.is-best, .reply.is-peeked-great { --edge: var(--great); --deep: var(--great-deep); --tint: var(--great-wash); color: #0b5139; }
.reply.is-ok, .reply.is-peeked-ok { --edge: var(--ok); --deep: var(--ok-deep); --tint: var(--ok-wash); color: #6b4200; }
.reply.is-oops, .reply.is-peeked-oops { --edge: var(--oops); --deep: var(--oops-deep); --tint: var(--oops-wash); color: #86201f; }
.reply.is-ok .reply-flag, .reply.is-ok .reply-mark { background: var(--ok-deep); }
.reply.is-great .reply-flag, .reply.is-best .reply-flag { background: var(--great-deep); box-shadow: 0 2px 0 #0b5139; }
.reply[class*="is-peeked-"] { --tint: var(--paper); }
.scene.is-checked .reply-act { color: inherit; opacity: .8; }
/* the best reply you missed: the brightest thing on the screen */
.reply.is-best { border-width: 4px; box-shadow: 0 6px 0 var(--deep), 0 0 0 5px rgba(31, 169, 122, .2); }
.reply.is-best .reply-mark { background: var(--banana); color: #7a5200; box-shadow: 0 3px 0 var(--banana-deep); }
/* whichever reply the feedback sheet is talking about wears a navy ring */
.reply.is-shown:not(.is-picked) { box-shadow: 0 6px 0 var(--deep), 0 0 0 4px var(--paper), 0 0 0 7px var(--ink); }
.reply.is-best.is-shown { box-shadow: 0 6px 0 var(--deep), 0 0 0 4px var(--paper), 0 0 0 7px var(--ink); }
.scene.is-checked .reply:active { transform: translateY(3px); }

/* checked: compact the top so the three cards fit between the top bar and the feedback sheet */
.scene.is-checked { gap: 12px; padding-top: 4px; }
.scene.is-checked .scene-setting { display: none; }
.scene.is-checked .scene-ask { position: absolute; width: 1px; height: 1px; margin: 0; overflow: hidden; }
.scene.is-checked .char { width: 84px; }
.scene.is-checked .char-eyes { animation: none; }
/* fixed height: the speaker's line changes as you tap between replies, and nothing below may move when it does */
.scene.is-checked .speaker { gap: 16px; height: 88px; }
.scene.is-checked .bubble-says { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.scene.is-checked .bubble-back { min-width: 150px; }
.scene.is-checked .bubble { padding: 15px 18px 11px; border-radius: 20px; box-shadow: 0 4px 0 rgba(35, 48, 79, .16); }
.scene.is-checked .bubble-says, .scene.is-checked .bubble-short .bubble-says, .scene.is-checked .bubble-long .bubble-says { font-size: 19px; }
.scene.is-checked .replies { gap: 16px; padding-top: 6px; padding-bottom: 10px; }
.scene.is-checked .reply { min-height: 70px; max-height: 160px; padding-block: 9px; }
.scene.is-checked .reply-face { width: 78px; transform: none; }
.scene.is-checked .reply-text { font-size: 19px; }
.scene.is-checked .reply-act { font-size: 14.500px; }

/* motion — entry runs once per round (class added by scene.js). Nothing here starts invisible: the cards are on screen and
   tappable from the first frame, they only settle into place. tokens.css switches it all off under reduced motion. */
.scene.is-enter .char { animation: sc-pop .34s cubic-bezier(.3, 1.5, .5, 1) backwards; }
.scene.is-enter .bubble { transform-origin: 0 55%; animation: sc-bubble .3s .04s cubic-bezier(.3, 1.4, .5, 1) backwards; }
.scene.is-enter .reply { animation: sc-rise .26s calc(var(--n, 0) * .045s) cubic-bezier(.25, 1.3, .5, 1) backwards; }
.scene.is-enter .reply-face { animation: sc-face .4s calc(.1s + var(--n, 0) * .06s) cubic-bezier(.3, 1.6, .5, 1) backwards; }
.reply.just-picked { animation: sc-pick .26s cubic-bezier(.3, 1.6, .5, 1); }
.scene:not(.is-checked) .reply.just-picked { animation-name: sc-pick-in; }
/* after Check the speaker answers back: the face and the bubble pop so the eye goes there first */
.speaker.is-react .char { animation: sc-pop .36s cubic-bezier(.3, 1.6, .5, 1) backwards; }
.speaker.is-react .bubble { transform-origin: 0 55%; animation: sc-react .34s .05s cubic-bezier(.3, 1.6, .5, 1) backwards; }
.reply.just-picked .reply-face { animation: sc-face .34s cubic-bezier(.3, 1.8, .5, 1) backwards; }
.reply.is-great.just-checked { animation: sc-yes .5s cubic-bezier(.3, 1.5, .5, 1); }
.reply.is-ok.just-checked { animation: sc-pick .3s; }
.reply.is-oops.just-checked { animation: sc-no .42s; }
.reply.is-best.just-checked { animation: sc-best .9s .25s cubic-bezier(.3, 1.4, .5, 1) backwards; }
.reply.just-checked .reply-mark, .reply.just-checked .reply-flag { animation: sc-mark .36s .1s cubic-bezier(.3, 1.7, .5, 1) backwards; }
@keyframes sc-pop { from { transform: scale(.82) rotate(-7deg); } }
@keyframes sc-bubble { from { transform: scale(.88) translateX(-8px); } }
@keyframes sc-rise { from { transform: translateY(14px); } }
@keyframes sc-face { from { transform: scale(.7) rotate(-14deg); } }
@keyframes sc-mark { from { transform: scale(.4) rotate(-12deg); } }
@keyframes sc-pick-in { 0% { transform: scale(.97); } 60% { transform: scale(1.045); } 100% { transform: scale(1.025); } }
@keyframes sc-react { 0% { transform: scale(.8) translateX(-6px); } 60% { transform: scale(1.05); } 100% { transform: none; } }
@keyframes sc-pick { 0% { transform: scale(.97); } 60% { transform: scale(1.02); } 100% { transform: none; } }
@keyframes sc-yes { 0% { transform: none; } 35% { transform: translateY(-7px) scale(1.02); } 70% { transform: translateY(1px); } 100% { transform: none; } }
@keyframes sc-no { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
@keyframes sc-best { 0% { transform: none; } 25% { transform: scale(1.035); box-shadow: 0 6px 0 var(--deep), 0 0 0 12px rgba(31, 169, 122, .28); } 55% { transform: scale(.995); } 100% { transform: none; } }
@keyframes char-blink { 0%, 95%, 100% { transform: none; } 97.5% { transform: scaleY(.1); } }

/* touch screens have no number keys */
@media (hover: none) { .reply-key { display: none; } }

@media (max-width: 560px) {
  .scene { gap: 13px; padding-top: 2px; }
  .scene-head { gap: 5px; }
  .scene-skill { font-size: 13px; gap: 7px; }
  .scene-skill-ic { width: 22px; height: 22px; padding: 4px; }
  .scene-setting { font-size: 17.500px; line-height: 1.28; }
  .speaker { gap: 13px; margin-top: 6px; }
  .char { width: 92px; margin-left: -4px; }
  .bubble { flex: 1 1 0; padding: 17px 13px 13px; border-radius: 22px; box-shadow: 0 5px 0 rgba(35, 48, 79, .16); }
  .bubble::before { left: -11px; width: 17px; height: 17px; }
  .bubble-who { left: 13px; top: -12px; font-size: 12px; padding: 4px 10px 3px; }
  .bubble-says { font-size: 20px; line-height: 1.16; }
  .bubble-short .bubble-says { font-size: 22px; }
  .bubble-long .bubble-says { font-size: 18.500px; }
  .scene-ask { font-size: 20px; margin: 2px 0 -4px; }
  .replies { gap: 12px; }
  .reply { min-height: 76px; max-height: 150px; padding: 10px 14px 10px 10px; gap: 10px; border-radius: 20px; }
  .reply-face { width: 76px; }
  .reply-key { display: none; }
  .reply-body { gap: 4px; }
  .reply-text { font-size: 17px; line-height: 1.24; }
  .reply-act { font-size: 14px; }
  .reply-act-ic { width: 13px; height: 13px; }
  .reply-mark { width: 30px; height: 30px; }
  .reply-mark-ic { width: 19px; height: 19px; }
  .reply-why { font-size: 17px; }
  .reply-flag { left: 12px; top: -12px; font-size: 11.500px; padding: 4px 9px 3px; }

  .scene.is-checked { gap: 10px; padding-top: 0; }
  .scene.is-checked .scene-head { display: none; }
  .scene.is-checked .speaker { gap: 12px; margin-top: 4px; height: 66px; }
  .scene.is-checked .bubble-back { min-width: 0; }
  .scene.is-checked .char { width: 62px; margin-left: 0; }
  .scene.is-checked .bubble { padding: 13px 12px 8px; border-width: 2.500px; border-radius: 18px; }
  .scene.is-checked .bubble-says, .scene.is-checked .bubble-short .bubble-says, .scene.is-checked .bubble-long .bubble-says { font-size: 16.500px; line-height: 1.15; }
  .scene.is-checked .bubble-who { font-size: 11px; top: -11px; }
  .scene.is-checked .replies { gap: 15px; padding-top: 8px; padding-bottom: 8px; }
  .scene.is-checked .reply { min-height: 62px; max-height: 132px; padding: 8px 10px 7px 8px; gap: 8px; border-radius: 18px; }
  .scene.is-checked .reply-face { width: 62px; }
  .scene.is-checked .reply-text { font-size: 16.500px; line-height: 1.2; }
  .scene.is-checked .reply-act { font-size: 13.500px; line-height: 1.2; }
  .scene.is-checked .reply-body { gap: 2px; }
}
@media (max-width: 350px) {
  .char { width: 80px; }
  .bubble-says, .bubble-short .bubble-says { font-size: 19px; }
  .reply-face { width: 58px; }
}
/* tall phones have room to spare: spend it on the character */
@media (max-width: 560px) and (min-width: 351px) and (min-height: 740px) {
  .scene { gap: 15px; padding-top: 6px; }
  .scene:not(.is-checked) .char { width: 100px; }
  .scene:not(.is-checked) .bubble { padding: 19px 14px 15px; }
  .scene:not(.is-checked) .bubble-says { font-size: 20.500px; }
  .scene:not(.is-checked) .bubble-short .bubble-says { font-size: 23px; }
  .scene:not(.is-checked) .bubble-long .bubble-says { font-size: 19px; }
  .scene-ask { font-size: 22px; }
}
/* short windows: keep the cards on screen by trimming the portrait */
@media (min-width: 561px) and (max-height: 860px) {
  .scene { gap: 12px; padding-top: 2px; }
  .scene:not(.is-checked) .char { width: 124px; }
  .reply { min-height: 78px; }
  .reply-face { width: 68px; }
}
/* small, short phones: trim the top and the card padding so all three replies stay above the Check button */
@media (max-width: 560px) and (max-height: 700px) {
  .scene { gap: 9px; padding-top: 0; }
  .speaker { margin-top: 4px; }
  .scene:not(.is-checked) .char { width: 74px; }
  .scene:not(.is-checked) .bubble { padding: 14px 12px 10px; }
  .scene:not(.is-checked) .bubble-says, .scene:not(.is-checked) .bubble-short .bubble-says { font-size: 18px; }
  .scene-ask { font-size: 18px; margin: 0 0 -3px; }
  .replies { gap: 10px; padding-bottom: 2px; }
  .reply { min-height: 60px; padding-block: 6px; box-shadow: 0 4px 0 var(--deep); }
  .reply-face { width: 58px; }
  .reply-text { font-size: 16px; line-height: 1.2; }
  .reply-act { font-size: 13px; line-height: 1.2; }
}

/* PIECE B — feedback moment (docked footer). One beat after Check: monkey + verdict + bananas → one reason → Continue.
   The button never moves: same width, same bottom-right spot (full-width bottom on phones) in every state; no resting
   transforms on it. The sheet grows upward above it. Only `.is-arriving` (added once, on Check) animates. */
.dock { --fb-wash: var(--paper); --fb-deep: var(--ink); --fb-btn: var(--banana); --fb-edge: var(--banana-deep);
  position: relative; overflow: hidden; background: var(--paper); border-top: 2px solid var(--line); }
.dock-in { position: relative; padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px)); }
.dock-row { max-width: 860px; margin: 0 auto; display: flex; align-items: flex-end; gap: 22px; }

/* ---------- the one button: chunky, obviously pressable, always in the same place ---------- */
.dock .btn { flex: none; width: 200px; min-width: 0; min-height: 58px; padding: 0 16px; margin: 0 0 5px; border-radius: 18px;
  font: 800 18px/1 var(--body); letter-spacing: .07em; text-transform: uppercase;
  background: var(--fb-btn); color: var(--ink); box-shadow: 0 5px 0 var(--fb-edge), inset 0 2px 0 rgba(255,255,255,.35);
  transition: transform .08s, box-shadow .08s, filter .12s; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.dock .btn:hover:not(:disabled) { filter: brightness(1.06); }
.dock .btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 0 0 var(--fb-edge), inset 0 2px 0 rgba(255,255,255,.35); }
.dock .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.dock .btn:disabled { background: #e9edf5; color: #9aa5be; box-shadow: 0 5px 0 #dbe1ee; cursor: default; }

/* ---------- before Check ---------- */
.dock-check .dock-row { justify-content: space-between; }
.dock-hint { margin: 0; align-self: center; font: 700 17px/1.2 var(--body); color: var(--ink-soft); }
.dock-check.is-ready .dock-hint { color: var(--ink); }
/* "ready" is a ring that breathes out of the button — the button itself stays put */
.dock-check.is-ready .btn::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: 0 0 0 0 rgba(255, 201, 51, .75); animation: fb-ring 2.4s .2s ease-out infinite; }
@keyframes fb-ring { 0% { box-shadow: 0 0 0 0 rgba(255, 201, 51, .75); } 45%, 100% { box-shadow: 0 0 0 14px rgba(255, 201, 51, 0); } }

/* ---------- after Check: tones ---------- */
.dock-fb { border-top-color: transparent; }
.dock-great { --fb-wash: var(--great-wash); --fb-deep: var(--great-deep); --fb-btn: #179468; --fb-edge: #0e6b4a; }
.dock-ok    { --fb-wash: var(--ok-wash);    --fb-deep: var(--ok-deep);    --fb-btn: #c97b00; --fb-edge: #955a00; }
/* oops reads "let's look at that": warm peach and soft coral, not alarm red */
.dock-oops  { --fb-wash: #fff0e6;           --fb-deep: #a4432f;           --fb-btn: #d95f4b; --fb-edge: #a84433; }
/* peeking at a reply that isn't yours: no verdict colour at all — calm grey-blue, navy button */
.dock-peek  { --fb-wash: #e9eef8;           --fb-deep: var(--ink);        --fb-btn: #3a4a78; --fb-edge: #232f52; }
.dock-fb::before { content: ''; position: absolute; inset: 0 0 -24px; background: var(--fb-wash); }
.dock-fb .btn { color: #fff; }

.fb-body { flex: 1; min-width: 0; align-self: center; display: flex; align-items: center; gap: 16px; }

/* icon: monkey on a white disc, with a little verdict badge */
.fb-icon { position: relative; flex: none; width: 72px; height: 72px; }
.fb-disc { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 50%; background: #fff; box-shadow: 0 4px 0 rgba(35,48,79,.10); }
.fb-monkey { width: 84%; height: 84%; display: block; }
.fb-badge-wrap { position: absolute; right: -4px; bottom: -4px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%;
  background: var(--fb-btn); border: 3px solid var(--fb-wash); }
.fb-badge { width: 19px; height: 19px; display: block; }
.fb-sparks { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
.fb-sparks i { position: absolute; left: -4.5px; top: -4.5px; width: 9px; height: 9px; border-radius: 3px; background: var(--banana); opacity: 0;
  transform: rotate(var(--a)) translateY(calc(var(--d) * -1)) scale(.2); }
.fb-sparks i:nth-child(3n) { background: var(--great); border-radius: 50%; }
.fb-sparks i:nth-child(4n+1) { background: #ff8a80; }

/* words: headline, then ONE reason line, then at most one quiet extra */
.verdict { flex: 1; min-width: 0; }
.verdict-top { display: flex; align-items: center; gap: 10px; min-height: 34px; }
.verdict-head { margin: 0; min-width: 0; white-space: nowrap; overflow: hidden; padding-bottom: 2px; font: 800 30px/1.05 var(--display); color: var(--fb-deep); }
.verdict-peek { font-size: 20px; line-height: 1.1; color: var(--ink); opacity: .78; }
.fb-reward { flex: none; display: inline-flex; align-items: center; gap: 1px; padding: 2px 8px 2px 11px; border-radius: 99px; background: #fff; box-shadow: 0 3px 0 rgba(35,48,79,.10); }
.fb-plus { font: 800 19px/1 var(--display); color: #b98600; margin-right: 2px; padding-top: 2px; }
.fb-nana { display: inline-grid; }
.fb-banana { width: 24px; height: 24px; display: block; }
.is-peek .fb-reward { visibility: hidden; }   /* the bananas belong to the player's own reply; keep the space, hide the claim */
/* all three reasons share one cell, so the sheet is as tall as the longest whichever one is showing */
.fb-whys { display: grid; margin: 3px 0 0; }
.fb-whys > .verdict-why { grid-area: 1 / 1; }
.verdict-why.is-ghost { visibility: hidden; }
.verdict-why { margin: 0; max-width: 34em; font: 700 18px/1.3 var(--body); color: var(--ink); text-wrap: pretty; }

.fb-foot { margin: 6px 0 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 16px; font: 700 13.5px/1.3 var(--body); color: var(--fb-deep); }
.fb-foot p { margin: 0; display: flex; align-items: center; gap: 6px; }
.fb-foot p[hidden] { display: none; }
.fb-hint { opacity: .82; white-space: nowrap; }
.fb-tap { flex: none; width: 16px; height: 16px; }
.fb-foot .fb-tip { align-items: baseline; gap: 8px; color: var(--ink); font-size: 14px; }
.fb-tip b { flex: none; padding: 3px 7px 2px; border-radius: 6px; background: rgba(255,255,255,.85); color: var(--fb-deep);
  font: 800 10.5px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; }
.fb-tip.is-tight b { font-size: 0; letter-spacing: 0; }
.fb-tip.is-tight b::after { content: 'New'; font-size: 10.5px; letter-spacing: .08em; }

/* gentle scenes: same shape, lower voice */
.is-gentle .verdict-head:not(.verdict-peek) { font: 700 24px/1.1 var(--display); }
.is-gentle .fb-reward { box-shadow: none; background: rgba(255,255,255,.7); }
.is-gentle .fb-plus { font-size: 16px; }
.is-gentle .fb-banana { width: 19px; height: 19px; }

/* ---------- arrival (once, on Check). Everything starts visible-but-small: no empty frames. The button does not move. ---------- */
.is-arriving::before { animation: fb-rise .34s cubic-bezier(.2,.9,.3,1.15) backwards; }
.is-arriving .fb-disc { animation: fb-pop .46s cubic-bezier(.3,1.7,.5,1) backwards; }
.is-arriving .fb-badge-wrap { animation: fb-pop-s .4s .16s cubic-bezier(.3,1.9,.5,1) backwards; }
.is-arriving .fb-reward { animation: fb-pop-s .4s .1s cubic-bezier(.3,1.7,.5,1) backwards; }
.is-arriving .fb-nana { animation: fb-nana .42s calc(.22s + var(--n) * .14s) cubic-bezier(.3,1.9,.5,1) backwards; }
.is-arriving .verdict-head, .is-arriving .verdict-why, .is-arriving .fb-foot { animation: fb-in .3s ease-out backwards; }
.is-arriving .fb-foot { animation-delay: .5s; animation-name: fb-fade; }
.is-arriving .fb-sparks i { animation: fb-spark .7s .12s cubic-bezier(.2,.8,.3,1) both; }
.is-arriving.dock-ok .fb-disc { animation-name: fb-pop-ok; }
.is-arriving.dock-oops .fb-disc { animation: fb-tilt .6s ease-out backwards; }
.is-arriving.is-gentle .fb-disc, .is-arriving.is-gentle .fb-badge-wrap, .is-arriving.is-gentle .fb-reward { animation: fb-soft .5s ease-out backwards; }
.is-arriving.is-gentle .fb-nana { animation: none; }
@keyframes fb-rise { from { transform: translateY(100%); } }
@keyframes fb-pop { from { transform: scale(.62) rotate(-16deg); } }
@keyframes fb-pop-s { from { transform: scale(.6); } }
@keyframes fb-pop-ok { from { transform: scale(.62); } 70% { transform: scale(1.07) rotate(6deg); } }
@keyframes fb-tilt { from { transform: scale(.7); } 45% { transform: scale(1.03) rotate(-8deg); } 75% { transform: rotate(4deg); } }
@keyframes fb-soft { from { transform: scale(.9); opacity: .5; } }
@keyframes fb-nana { from { transform: translateY(-9px) scale(.55) rotate(-50deg); } }
@keyframes fb-in { from { transform: translateY(6px); opacity: .35; } }
@keyframes fb-fade { from { opacity: 0; } }
@keyframes fb-spark { from { transform: rotate(var(--a)) translateY(-10px) scale(1); opacity: 1; } 60% { opacity: 1; } }

/* ---------- phone: sheet content on top, the button full-width at the very bottom ---------- */
@media (max-width: 600px) {
  .dock-in { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .dock-row { flex-direction: column; align-items: stretch; gap: 10px; }
  .dock .btn { width: 100%; min-height: 54px; }
  .dock-hint { display: none; }
  .fb-body { align-self: stretch; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 0 11px; align-items: center; }
  .fb-icon { width: 40px; height: 40px; }
  .fb-disc { box-shadow: 0 3px 0 rgba(35,48,79,.10); }
  .fb-badge-wrap { width: 20px; height: 20px; right: -5px; bottom: -4px; border-width: 2px; }
  .fb-badge { width: 13px; height: 13px; }
  .fb-sparks i { width: 6px; height: 6px; left: -3px; top: -3px; transform: rotate(var(--a)) translateY(calc(var(--d) * -.62)) scale(.2); }
  .verdict { display: contents; }
  .verdict-top { min-height: 40px; gap: 8px; }
  .verdict-head { font-size: 24px; }
  .verdict-peek { font-size: 18px; }
  .is-gentle .verdict-head:not(.verdict-peek) { font-size: 19px; }
  .fb-reward { padding: 2px 6px 2px 9px; }
  .fb-plus { font-size: 17px; }
  .fb-banana { width: 21px; height: 21px; }
  .fb-whys, .fb-foot { grid-column: 1 / -1; }
  .fb-whys { margin-top: 6px; }
  .verdict-why { font-size: 16px; line-height: 1.3; }
  .fb-foot { margin-top: 4px; font-size: 13px; line-height: 1.25; }
  .fb-foot .fb-tip { font-size: 13px; }
}

/* PIECE D — results screen. Every animation starts FROM a hidden/small keyframe and ends at the element's
   normal style, so with reduced motion (tokens.css kills animations) the finished screen shows at once. */
.results { --rs-wash: #fff3c4; --rs-ray: #ffe07a; --rs-deep: #b98500;
  display: flex; flex-direction: column; justify-content: center; gap: 12px; min-height: 100%; text-align: center; padding-top: 4px; }
.results[data-animal="penguin"] { --rs-wash: #e2f2ff; --rs-ray: #c3e3ff; --rs-deep: #2f6fb8; }
.results[data-animal="parrot"]  { --rs-wash: #ddf7ea; --rs-ray: #b8edd3; --rs-deep: #14815c; }
.results[data-animal="giraffe"] { --rs-wash: #ffecd9; --rs-ray: #ffd9b5; --rs-deep: #b5631c; }
.results[data-animal="sloth"]   { --rs-wash: #ece9ff; --rs-ray: #d9d3ff; --rs-deep: #6553c4; }
.results p, .results h1, .results ul { margin: 0; padding: 0; }
.rs-defs { position: absolute; }

/* ---- hero: the reveal ---- */
.rs-hero { position: relative; overflow: hidden; display: grid; justify-items: center; gap: 2px;
  padding: 14px 16px 16px; border-radius: 24px; background: var(--rs-wash); }
.rs-kicker { font: 800 14px/1.2 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--rs-deep);
  position: relative; z-index: 1; }
.rs-dots i { font-style: normal; display: inline-block; animation: rs-dot .5s 2 both; }
.rs-dots i:nth-child(2) { animation-delay: .12s; } .rs-dots i:nth-child(3) { animation-delay: .24s; }

.rs-art { position: relative; width: 176px; height: 136px; margin-top: 2px; }
.rs-art::before { content: ''; position: absolute; left: 50%; top: 54%; width: 330px; height: 330px; margin: -165px 0 0 -165px; border-radius: 50%;
  background: repeating-conic-gradient(var(--rs-ray) 0 15deg, transparent 15deg 30deg);
  -webkit-mask: radial-gradient(circle, #000 28%, transparent 66%); mask: radial-gradient(circle, #000 28%, transparent 66%);
  animation: rs-rays .6s 1.05s cubic-bezier(.2,.9,.3,1.2) both; }
.rs-art::after { content: ''; position: absolute; left: 50%; top: 54%; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%; background: var(--rs-ray); }
.rs-pop { position: absolute; inset: 0; z-index: 2; animation: rs-pop .6s 1.05s cubic-bezier(.3,1.5,.5,1) both; }
.rs-idle { display: block; width: 100%; height: 100%; transform-origin: 50% 90%; animation: rs-bob 3.2s 1.7s ease-in-out infinite; }
.rs-animal { display: block; width: 100%; height: 100%; overflow: visible; }
.results[data-animal="giraffe"] .rs-idle { animation-name: rs-wobble; animation-duration: 2.4s; }
.results[data-animal="penguin"] .rs-idle { animation-name: rs-glide; animation-duration: 3.6s; }
.results[data-animal="sloth"] .rs-idle { animation-name: rs-sway; animation-duration: 5s; transform-origin: 50% 10%; }
.rs-zz { animation: rs-zz 2.6s 1.8s ease-in-out infinite; }
.rs-q { position: absolute; left: 50%; top: 54%; z-index: 3; width: 84px; height: 84px; margin: -42px 0 0 -42px; display: grid; place-items: center;
  font: 800 64px/1 var(--display); color: var(--rs-deep); opacity: 0; animation: rs-q 1.1s both; }
.rs-spark { position: absolute; z-index: 1; width: 16px; height: 16px; color: var(--banana); animation: rs-spark .5s 1.35s cubic-bezier(.3,1.6,.5,1) both; }
.rs-spark svg { display: block; width: 100%; height: 100%; }
.rs-spark.s1 { left: -6px; top: 22px; } .rs-spark.s2 { right: -10px; top: 8px; width: 22px; height: 22px; animation-delay: 1.45s; }
.rs-spark.s3 { left: 6px; bottom: 14px; width: 11px; height: 11px; animation-delay: 1.55s; color: #fff; }
.rs-spark.s4 { right: 0; bottom: 30px; width: 12px; height: 12px; animation-delay: 1.5s; color: #fff; }
.results[data-animal="monkey"] .rs-spark, .results[data-animal="buddy"] .rs-spark { color: #fff; }
.results[data-animal="monkey"] .rs-spark.s3, .results[data-animal="buddy"] .rs-spark.s3 { color: var(--banana-deep); }

.rs-words { position: relative; z-index: 1; display: grid; gap: 4px; justify-items: center; min-width: 0; max-width: 100%; }
.rs-title { display: grid; font: 800 20px/1.1 var(--display); color: var(--ink); }
.rs-lead { color: var(--rs-deep); animation: rs-rise .35s .5s both; }
.rs-punch { font-size: 40px; line-height: .98; text-wrap: balance; padding-bottom: 2px; max-width: 100%; overflow-wrap: anywhere;
  animation: rs-land .5s 1.05s cubic-bezier(.2,.9,.3,1) both; }
.rs-title.is-long .rs-punch { font-size: 33px; }
.rs-blurb { max-width: 30ch; font-size: 16px; line-height: 1.3; font-weight: 700; color: var(--ink); opacity: .8; text-wrap: balance; animation: rs-rise .4s 1.5s both; }

/* ---- bananas you can see ---- */
.rs-score { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 18px;
  animation: rs-rise .4s 1.6s both; }
.rs-count { flex: none; min-width: 62px; display: grid; justify-items: center; }
.rs-num { font: 800 48px/.9 var(--display); color: var(--banana-deep); font-variant-numeric: tabular-nums; }
.rs-count span { font: 800 13px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.rs-bunch { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(var(--cols, 10), minmax(0, 1fr)); gap: 3px 1px; justify-items: center; }
.rs-b { position: relative; width: 100%; max-width: 34px; aspect-ratio: 1; }
.rs-b svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.rs-b-ghost { --b1: var(--mist); --b2: var(--line); --b3: transparent; }
.rs-b-full { animation: rs-ban .32s calc(1.75s + var(--i) * 45ms) cubic-bezier(.3,1.7,.5,1) both; }

/* ---- five skills at a glance ---- */
.rs-skills { list-style: none; display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 6px; }
.rs-skill { position: relative; display: grid; justify-items: center; align-content: start; gap: 4px; padding: 8px 2px 8px;
  border-radius: 16px; background: transparent; cursor: default;
  --tone: var(--line-deep); --disc: var(--mist); --fg: #93a0bb;
  animation: rs-rise .4s calc(2s + var(--i) * 70ms) cubic-bezier(.3,1.4,.5,1) both; }
.rs-skill.is-strong { --tone: var(--great); --disc: var(--great); --fg: #fff; }
.rs-skill.is-mid { --tone: var(--banana); --disc: #fff3c4; --fg: var(--banana-deep); }
.rs-skill.is-next { --tone: var(--pick); --disc: var(--pick-wash); --fg: var(--pick); background: var(--pick-wash); }
.rs-medal { position: relative; width: 48px; height: 48px; }
.rs-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.rs-ring circle { fill: none; stroke-width: 5; }
.rs-ring-track { stroke: var(--mist); }
.rs-ring-fill { stroke: var(--tone); stroke-linecap: round; animation: rs-ring .7s calc(2.15s + var(--i) * 70ms) ease-out both; }
.rs-skill.is-zero .rs-ring-fill { stroke: transparent; }
.rs-disc { position: absolute; inset: 9px; border-radius: 50%; background: var(--disc); color: var(--fg); display: grid; place-items: center; }
.rs-ico { width: 18px; height: 18px; display: block; }
.rs-tick { position: absolute; right: -4px; bottom: -3px; width: 20px; height: 20px; border-radius: 50%; background: var(--great-deep); border: 2px solid var(--paper); display: grid; place-items: center; }
.rs-tick svg { width: 11px; height: 11px; display: block; }
.rs-skill-name { font: 800 12.5px/1.12 var(--body); color: var(--ink); min-height: 2.24em; display: grid; align-items: center; text-wrap: balance; padding-inline: 1px; }
.rs-skill.is-low:not(.is-next) .rs-skill-name, .rs-skill.is-none .rs-skill-name { color: var(--ink-soft); }
.rs-skill.is-none .rs-ring-track { stroke-dasharray: 3 6; stroke: var(--line-deep); }
.rs-next-tag { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 3px 7px; border-radius: 99px;
  background: var(--pick); color: #fff; font: 800 10px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; }

.rs-tip { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 16px; background: var(--pick-wash); text-align: left;
  animation: rs-rise .4s 2.5s both; }
.rs-tip::before { content: ''; position: absolute; top: -7px; width: 16px; height: 16px; border-radius: 3px; background: inherit;
  left: calc((var(--at, 0) + .5) * (100% + 6px) / var(--n, 5) - 3px); transform: translateX(-50%) rotate(45deg); }
.rs-tip.is-all { background: var(--great-wash); }
.rs-tip.is-info { background: var(--mist); }
.rs-tip.is-all::before, .rs-tip.is-info::before { display: none; }
.rs-tip-face { flex: none; width: 44px; height: 44px; overflow: hidden; display: grid; place-items: center; }
.rs-tip-face svg { max-width: 100%; max-height: 100%; }
.rs-tip-text { font-size: 15px; line-height: 1.3; font-weight: 700; color: var(--ink); }
.rs-tip-k { display: block; margin-bottom: 2px; font: 800 12px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--pick); }
.rs-tip.is-all .rs-tip-k { color: var(--great-deep); }
.rs-tip.is-info .rs-tip-k { color: var(--ink-soft); }

/* ---- one obvious thing to do ---- */
.rs-end { display: contents; }
.rs-cta { position: sticky; bottom: -18px; z-index: 4; margin: -6px 0 -18px; padding: 10px 0 6px;
  background: linear-gradient(rgba(255,255,255,0), var(--paper) 12px); box-shadow: 0 26px 0 var(--paper); }
.rs-nudge { display: flex; align-items: center; justify-content: center; gap: 10px; text-align: left; animation: rs-rise .4s 2.6s both; }
.rs-nudge p { display: grid; line-height: 1.2; }
.rs-nudge b { font: 800 18px/1.15 var(--display); color: var(--ink); }
.rs-nudge p span { font-size: 14px; font-weight: 700; color: var(--ink-soft); }
.rs-sil { position: relative; flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--mist); display: grid; place-items: center; overflow: hidden; }
.rs-sil-art { width: 44px; height: 35px; margin-top: 6px; filter: brightness(0); opacity: .2; }
.rs-sil.is-won { background: #23304f; box-shadow: 0 0 0 3px var(--banana); }
.rs-sil.is-won .rs-sil-art { filter: none; opacity: 1; }
.rs-sil b { position: absolute; inset: 0; display: grid; place-items: center; font: 800 24px/1 var(--display); color: var(--ink-soft); }
.results .rs-go { width: 100%; min-height: 56px; font-size: 18px; }
.rs-confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; }

/* ---- 20 of 20: night-sky card, golden monkey, crown drops on, stars keep twinkling ---- */
.results[data-gold] { --rs-wash: #23304f; --rs-ray: #34477d; --rs-deep: #ffc933; }
.results[data-gold] .rs-hero { background: radial-gradient(120% 90% at 50% 38%, #2f4079, #1c2743); box-shadow: inset 0 0 0 3px var(--banana); }
.results[data-gold] .rs-title, .results[data-gold] .rs-blurb { color: #fff; }
.results[data-gold] .rs-blurb { opacity: .9; }
.results[data-gold] .rs-art::after { background: #41579a; box-shadow: 0 0 0 6px rgba(255,201,51,.28); }
.results[data-gold] .rs-art::before { animation: rs-rays .6s 1.05s cubic-bezier(.2,.9,.3,1.2) both, rs-spin 26s 1.7s linear infinite; }
.results[data-gold] .rs-art { margin-top: 10px; }
.rs-perfect { display: inline-block; margin-right: 4px; padding: 3px 9px; border-radius: 99px; background: var(--banana); color: #23304f; letter-spacing: .06em; }
.rs-crown { transform-box: fill-box; transform-origin: 50% 100%; animation: rs-crown .7s 1.5s cubic-bezier(.3,1.5,.5,1) both; }
.results[data-gold] .rs-spark { color: var(--banana); animation: rs-spark .5s 1.35s cubic-bezier(.3,1.6,.5,1) both, rs-twinkle 1.8s 2s ease-in-out infinite; }
.results[data-gold] .rs-spark.s3, .results[data-gold] .rs-spark.s4, .results[data-gold] .rs-spark.s6 { color: #fff; }
.results[data-gold] .rs-spark.s2 { animation-delay: 1.45s, 2.4s; } .results[data-gold] .rs-spark.s3 { animation-delay: 1.55s, 2.9s; }
.results[data-gold] .rs-spark.s4 { animation-delay: 1.5s, 2.2s; }
.rs-spark.s5 { left: -34px; top: 70px; width: 13px; height: 13px; animation-delay: 1.6s, 2.6s !important; }
.rs-spark.s6 { right: -38px; top: 58px; width: 14px; height: 14px; animation-delay: 1.65s, 3.1s !important; }
.rs-spark.s7 { right: -30px; bottom: 4px; width: 18px; height: 18px; animation-delay: 1.7s, 2.5s !important; }
.results[data-gold] .rs-num { display: inline-block; animation: rs-gold-num .5s calc(1.75s + 20 * 45ms) cubic-bezier(.3,1.6,.5,1) both; }

/* low scores: the art breathes a little slower and softer — kind, not flashy */
.results[data-cele="soft"] .rs-art::before { opacity: .7; }

/* ---- roomier on tablet/desktop: art beside the words ---- */
@media (min-width: 620px) {
  .results { gap: 14px; }
  .rs-hero { grid-template-columns: 236px 1fr; grid-template-rows: auto auto; column-gap: 12px; justify-items: start; align-items: center; padding: 18px 24px 18px 12px; text-align: left; }
  .rs-art { grid-row: 1 / 3; grid-column: 1; width: 236px; height: 184px; margin: 0; }
  .results[data-gold] .rs-art { margin: 0; }
  .results[data-gold] .rs-art::after { box-shadow: 0 0 0 4px rgba(255,201,51,.28); width: 168px; height: 168px; margin: -84px 0 0 -84px; }
  .rs-spark.s5 { left: 2px; top: 96px; } .rs-spark.s6 { right: -4px; top: 84px; } .rs-spark.s7 { right: 10px; bottom: 2px; }
  .rs-art::after { width: 178px; height: 178px; margin: -89px 0 0 -89px; }
  .rs-kicker { grid-column: 2; align-self: end; font-size: 15px; }
  .rs-words { grid-column: 2; align-self: start; justify-items: start; }
  .rs-title { font-size: 24px; }
  .rs-punch { font-size: 54px; } .rs-title.is-long .rs-punch { font-size: 44px; }
  .rs-blurb { font-size: 17px; max-width: 34ch; }
  .rs-score { padding: 12px 22px; gap: 22px; }
  .rs-num { font-size: 60px; } .rs-count span { font-size: 14px; }
  .rs-bunch { gap: 4px 2px; } .rs-b { max-width: 40px; }
  .rs-spark.s2 { right: 6px; top: 0; }
  .rs-skills { gap: 10px; }
  .rs-skill { padding: 12px 6px 10px; }
  .rs-medal { width: 60px; height: 60px; } .rs-disc { inset: 11px; } .rs-ico { width: 22px; height: 22px; }
  .rs-skill-name { font-size: 15px; min-height: 0; }
  .rs-tip { padding: 12px 18px; } .rs-tip-text { font-size: 16px; }
  .rs-tip::before { left: calc((var(--at, 0) + .5) * (100% + 10px) / var(--n, 5) - 5px); }
  .rs-end { position: sticky; bottom: -18px; z-index: 4; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px;
    margin-bottom: -18px; padding: 8px 0 6px; background: linear-gradient(rgba(255,255,255,0), var(--paper) 12px); box-shadow: 0 26px 0 var(--paper); }
  .rs-cta { position: static; margin: 0; padding: 0; background: none; box-shadow: none; }
  .rs-nudge { justify-content: flex-start; }
  .results .rs-go { width: auto; min-width: 240px; }
}
@media (max-height: 700px) and (max-width: 619px) {
  .rs-art { width: 150px; height: 116px; }
  .rs-punch { font-size: 34px; } .rs-title.is-long .rs-punch { font-size: 29px; }
}

@keyframes rs-dot { 0%, 100% { transform: none; } 50% { transform: translateY(-4px); } }
@keyframes rs-q { 0% { opacity: 0; transform: scale(.4); } 18% { opacity: 1; transform: scale(1.1) rotate(-8deg); } 45% { opacity: 1; transform: scale(1) rotate(8deg); } 80% { opacity: 1; transform: scale(1.05) rotate(-6deg); } 100% { opacity: 0; transform: scale(1.5); } }
@keyframes rs-pop { from { opacity: 0; transform: scale(.2) rotate(-14deg); } 30% { opacity: 1; } }
@keyframes rs-rays { from { opacity: 0; transform: scale(.3) rotate(-40deg); } }
/* lands by growing UP to full size (never past it), so it can't poke out of the card on a phone */
@keyframes rs-land { from { opacity: 0; transform: scale(.55) translateY(10px); } 45% { opacity: 1; } }
@keyframes rs-crown { from { opacity: 0; transform: translateY(-46px) rotate(24deg) scale(1.3); } 55% { opacity: 1; } }
@keyframes rs-spin { to { transform: rotate(360deg); } }
@keyframes rs-twinkle { 0%, 100% { transform: none; opacity: 1; } 50% { transform: scale(.45) rotate(45deg); opacity: .5; } }
@keyframes rs-gold-num { 0% { transform: none; } 50% { transform: scale(1.25) rotate(-6deg); } 100% { transform: none; } }
@keyframes rs-rise { from { opacity: 0; transform: translateY(12px); } }
@keyframes rs-spark { from { opacity: 0; transform: scale(0) rotate(-90deg); } }
@keyframes rs-ban { from { opacity: 0; transform: scale(.1) rotate(-50deg); } }
@keyframes rs-ring { from { stroke-dashoffset: var(--c); } }
@keyframes rs-bob { 0%, 100% { transform: none; } 50% { transform: translateY(-4px) rotate(1.5deg); } }
@keyframes rs-wobble { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
@keyframes rs-glide { 0%, 100% { transform: translateX(-7px) rotate(-2deg); } 50% { transform: translateX(7px) rotate(2deg); } }
@keyframes rs-sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
@keyframes rs-zz { 0%, 100% { opacity: .35; transform: translateY(3px); } 50% { opacity: 1; transform: translateY(-3px); } }

</style>

<body>
<div id="tio" data-screen="start">
  <header id="tio-top"></header>
  <main id="tio-stage"></main>
  <footer id="tio-dock"></footer>
</div>
<script>
/* PIECE E — scene writing. Owns: SKILLS, SCENES, TITLES.
   Shape is a contract with the other pieces; add optional fields freely, don't rename existing ones.
   Word budgets (hard): setting ≤ 9 · says ≤ 9 · reply text ≤ 8 · act ≤ 4 · why ≤ 12 (one idea) · tip ≤ 9 · blurb ≤ 10.
   Whole pre-tap screen (setting + says + three replies with their DO lines) ≤ 40 words.
   who.mood: happy | sad | smirk | angry | curious | stern | excited | embarrassed.
   reply.vibe: kind | blunt | gush | mumble | joke | snap | calm | rush | shrug | curious. It is how the reply FEELS
     to the person saying it, never a verdict: every vibe in use sits on both best and wrong replies, and the
     gentle rounds use only kind | calm | mumble | curious. (`snap` is allowed but unused: a comeback feels great.)
   reply.back (optional, ≤ 4 words): what the other person says straight after this reply. reply.backMood: their
     face then (same list as who.mood). Quiet and never punishing in the gentle rounds.
   scene.tone: 'gentle' on the two loss rounds (quiet feedback, no fanfare).
   In a round either all three replies have an `act` or none do. */
window.TIO = window.TIO || {};

/* Names must make sense cold on the start-screen chips. Tips are shown once, the first time a skill is met,
   so each is plain (no image) and true for both rounds of its skill. */
TIO.SKILLS = {
  real:     { name: 'Be real',          tip: 'Say true things kindly. No fibs, no faking.' },
  present:  { name: 'Eyes up',          tip: 'Screen away. Eyes on the person talking.' },
  well:     { name: 'Say less',         tip: 'Say a little. They can ask for more.' },
  comfort:  { name: 'Be there',         tip: 'Say it’s unfair. Or just do something kind.' },
  cool:     { name: 'Stay cool',        tip: 'Wait five seconds. Then ask a calm question.' }
};

/* rating: 'great' (2 bananas) | 'ok' (1) | 'oops' (0). Each scene needs exactly one of each.
   Order: light and funny first; the two loss rounds are 4 and 7 with two light rounds between; a win to finish.
   After Check any reply's `why` can be opened, picked or not, so every `why` describes the REPLY (never "you said…"),
   stands on its own and explains any image it uses. Wrong `act` lines must sound sensible to the kid doing them. */
TIO.SCENES = [
  { id: 'haircut', skill: 'real',
    who: { name: 'Maya', face: '👧', color: '#ffb4a2', mood: 'happy' },
    setting: 'Maya cut her own fringe. It’s very short.',
    says: 'Do you love it?',
    replies: [
      { text: 'It’s so YOU! Love how happy you are.', rating: 'great', vibe: 'gush',
        why: 'All true and all kind. No fib needed.',
        back: 'Aww, thanks!', backMood: 'happy' },
      { text: 'I LOVE it! Best fringe ever!', rating: 'ok', vibe: 'kind',
        why: 'Kind, but a fib. Fibs make real compliments worth less.',
        back: 'Really? Best EVER?', backMood: 'curious' },
      { text: 'Um… it’s a bit wonky.', rating: 'oops', vibe: 'blunt',
        why: 'True, but ouch. Being real doesn’t mean being rude.',
        back: 'Oh.', backMood: 'sad' }
    ] },
  { id: 'rocket', skill: 'present',

    S.i = Math.max(0, Math.min(T.SCENES.length - 1, (+q.get('r') || 1) - 1)); newRound();
    if (q.has('pick')) {
      var want = q.get('pick');
      S.order.forEach(function (ri, k) { if (T.cur().replies[ri].rating === want) S.picked = k; });
    }
    draw();
    if (q.has('check')) T.actions.check();
  } else draw();
})();

</script>
